<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Solicitação</title>
    <link rel="stylesheet" href="request.css">
</head>
<body>
    <div class="container">
        <input type="text" id="text-input" placeholder="Digite algo">
        <div class="checkbox">
            <input type="checkbox" id="represent">
            <label for="represent">Representante</label>
            <input type="checkbox" id="resummer">
            <label for="resummer">Resumos</label>
        </div>
        <div id="resummer-link-container" style="display: none;">
            <input type="text" id="resummer-link" placeholder="Cole o link do resumo">
        </div>
        <button type="button" id="post-button">Enviar</button>
        <button type="button" id="cancel-button" onclick="cancel()">Cancelar</button>
    </div>

        <!-- Modal de Carregamento -->
    <div id="loading-modal" class="loading-modal hide">
        <div class="loading-content">
            <div class="spinner"></div>
        </div>
    </div>

    <!-- Carregue o Firebase e a Configuração -->
    <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>
    <script src="../../firebaseConfig.js"></script>
    <script>
        function showLoadingModal() {
            const loadingModal = document.getElementById('loading-modal');
            loadingModal.classList.remove('hide');
        }

        function hideLoadingModal() {
            const loadingModal = document.getElementById('loading-modal');
            loadingModal.classList.add('hide');
        }

        document.addEventListener('DOMContentLoaded', function() {
            const postButton = document.getElementById('post-button');
            const resummerCheckbox = document.getElementById('resummer');
            const resummerLinkContainer = document.getElementById('resummer-link-container');

            // Mostrar ou esconder o campo de link do resumo baseado no checkbox
            resummerCheckbox.addEventListener('change', function() {
                if (this.checked) {
                    resummerLinkContainer.style.display = 'block';
                } else {
                    resummerLinkContainer.style.display = 'none';
                }
            });

            postButton.addEventListener('click', function() {
                const textInput = document.getElementById('text-input').value.trim();
                const isRepresent = document.getElementById('represent').checked;
                const isResummer = document.getElementById('resummer').checked;
                const resummerLink = isResummer ? document.getElementById('resummer-link').value.trim() : '';

                firebase.auth().onAuthStateChanged(user => {
                    if (user) {
                        showLoadingModal()
                        const uid = user.uid;
                        const requestRef = firebase.firestore().collection('requests').doc(uid);

                        requestRef.set({
                            text: textInput,
                            represent: isRepresent,
                            resummer: isResummer,
                            resummerLink: resummerLink, // Adiciona o link do resumo
                            timestamp: firebase.firestore.FieldValue.serverTimestamp()
                        }).then(() => {
                            alert('Sua solicitação está em análise. Se não aparecer um ícone no seu perfil em até 24 horas, isso significa que a solicitação não foi aceita.');
                            // Limpar os campos
                            hideLoadingModal()
                            document.getElementById('text-input').value = '';
                            document.getElementById('represent').checked = false;
                            document.getElementById('resummer').checked = false;
                            document.getElementById('resummer-link').value = '';
                            resummerLinkContainer.style.display = 'none'; // Esconde o campo de link após o envio
                            window.location.href = 'home.html'
                        }).catch(error => {
                            hideLoadingModal()
                            console.error('Erro ao salvar dados:', error);
                        });
                    } else {
                        alert('Usuário não autenticado.');
                    }
                });
            });
        });

        function cancel() {
            window.location.href = 'home.html'
        }
    </script>

<script>
    document.addEventListener("DOMContentLoaded", () => {
// Inicializa o Firebase (certifique-se de que o firebaseConfig.js esteja configurado corretamente)
const db = firebase.firestore();
const auth = firebase.auth();

// Função para carregar a cor do usuário do Firestore
const loadUserColor = async () => {
const user = auth.currentUser;

if (user) {
  // Pega o UID do usuário
  const uid = user.uid;
  
  // Acessa a coleção "users" e o documento com o UID
  const userDoc = await db.collection('users').doc(uid).get();
  
  if (userDoc.exists) {
    const userData = userDoc.data();
    const userColor = userData.color;
    
    if (userColor) {
      // Define a classe do body para a cor armazenada
      document.body.classList.add(userColor);
      
      // Marca o item correspondente como "Selecionado"
      const colorElements = document.querySelectorAll('.color');
      colorElements.forEach(color => {
        if (color.querySelector('p#color-name').getAttribute('data') === userColor) {
          color.querySelector('#selected').style.display = 'block';
        } else {
          color.querySelector('#selected').style.display = 'none'; // Garante que os outros fiquem invisíveis
        }
      });
    }
  }
}
};

// Escuta a mudança no estado de autenticação
auth.onAuthStateChanged(async (user) => {
if (user) {
  // Se o usuário estiver autenticado, carrega a cor
  await loadUserColor();
} else {
  // Caso o usuário não esteja autenticado, você pode tratar aqui, se necessário
  console.log("Usuário não autenticado");
}
});

// Seleciona todos os elementos .color
const colors = document.querySelectorAll('.color');

colors.forEach(color => {
// Quando um item for clicado
color.addEventListener('click', async () => {
  // Remove a classe 'selected' de todos os itens
  document.querySelectorAll('.color p#selected').forEach(selected => {
    selected.style.display = 'none';
  });

  // Adiciona a classe 'selected' ao item clicado
  color.querySelector('#selected').style.display = 'block';

  // Extrai o valor do atributo 'data' do item clicado
  const dataValue = color.querySelector('p#color-name').getAttribute('data');

  // Adiciona a classe correspondente no body
  document.body.classList.remove(...document.body.classList); // Remove qualquer classe anterior
  document.body.classList.add(dataValue);

  // Atualiza a cor no Firestore
  const user = auth.currentUser;
  if (user) {
    const uid = user.uid;
    await db.collection('users').doc(uid).set({
      color: dataValue
    }, { merge: true });
  }
});
});
});

  </script>
</body>
</html>
